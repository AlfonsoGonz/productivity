<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 872.6 256.8" width="872.6" height="256.8">
  <title id="title">PRODUCTIVITY</title>
  <desc id="desc">Dynamic productivity logo with a forward-motion symbol and italic condensed lettering.</desc>
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35D7FF"/>
      <stop offset="1" stop-color="#196AFF"/>
    </linearGradient>
  </defs>
  <!-- Icon retains the original 256 x 256 footprint, with a new motion-focused symbol. -->
  <rect x="0" y="0" width="256" height="256" rx="68" fill="#101B32"/>
  <path d="M42 146h75l-27 28h49l83-83h-50l-29 29H68z" fill="url(#mark)"/>
  <path d="M49 91h76l-18 18H31z" fill="#35D7FF" opacity=".95"/>
  <path d="M63 185h65l-18 18H45z" fill="#196AFF" opacity=".9"/>
  <path d="M165 49h48l-42 42h-48z" fill="#35D7FF"/>
  <!-- Wordmark occupies the same right-hand area as the source logo. -->
  <text x="300" y="177" fill="#101B32"
        font-family="DejaVu Sans, Arial, sans-serif"
        font-size="69" font-weight="900" font-style="italic"
        letter-spacing="-3.8" textLength="558" lengthAdjust="spacingAndGlyphs">PRODUCTIVITY</text>
</svg>
